name: Aktualizacja dzis.ai

on:
  schedule:
    # Skrypt uruchomi się codziennie o godzinie 06:00 czasu UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Pozwala też uruchomić skrypt ręcznie w dowolnym momencie

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Wymuszenie użycia Node.js 24 w akcjach zgodnie z zaleceniem GitHuba
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Pobranie kodu repozytorium
      uses: actions/checkout@v4

    - name: Konfiguracja Pythona
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Poprawiony parametr (zamiast python-node-version)

    - name: Instalacja bibliotek
      run: |
        pip install -r requirements.txt

    - name: Uruchomienie skryptu i generowanie HTML
      run: |
        python app.py

    - name: Automatyczna aktualizacja plików na GitHubie
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add index.html
        git diff-index --quiet HEAD || git commit -m "Automatyczna aktualizacja: $(date)"
        git push
